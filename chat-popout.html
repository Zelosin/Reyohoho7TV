<!DOCTYPE html>
<html lang="ru" class="reyohoho-extension-popout-root">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReYohoho — Чат</title>
</head>
<body class="reyohoho-extension-popout">
  <div id="reyohoho-popout-root" class="watch-party-ui reyohoho-chat-popout-panel">
    <div id="reyohoho-popout-header" class="wp-header reyohoho-popout-header"></div>
    <div id="wp-chat-messages" class="wp-chat-messages"></div>
    <div class="wp-chat-input-wrapper">
      <div class="reyohoho-input-shell">
        <div id="reyohoho-popout-input-mirror" class="reyohoho-input-mirror" aria-hidden="true"></div>
        <input id="wp-chat-input" class="wp-chat-input reyohoho-input-mirror-field" type="text" placeholder="Написать сообщение..." autocomplete="off" />
        <div id="reyohoho-popout-compose-hint" class="reyohoho-compose-preview-hint" hidden></div>
      </div>
      <button id="wp-chat-send" class="wp-chat-send" type="button" aria-label="Отправить">➤</button>
    </div>
  </div>
  <div id="reyohoho-popout-status" class="reyohoho-popout-status" hidden></div>
  <script src="shared/chat-core.js"></script>
  <script src="chat-popout.js"></script>
</body>
</html>
